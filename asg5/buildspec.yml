version: 0.2

env:
  variables:
    ECR_REPOSITORY: asg5-container-demo

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY
      - IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
  build:
    commands:
      - echo "Building the container image"
      - docker build -f asg5/Dockerfile -t "$ECR_REPOSITORY:$IMAGE_TAG" asg5
      - docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$REPOSITORY_URI:$IMAGE_TAG"
      - docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$REPOSITORY_URI:latest"
  post_build:
    commands:
      - echo "Pushing commit-tagged image to Amazon ECR"
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - echo "Updating latest tag"
      - docker push "$REPOSITORY_URI:latest"
