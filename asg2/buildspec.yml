version: 0.2
phases:
  install:
    commands:
      - pip install -r asg2/requirements.txt
  build:
    commands:
      - PYTHONPATH=asg2:$PYTHONPATH python -m pytest -q asg2/tests
      - mkdir -p asg2/dist
      - echo "Build completed" > asg2/dist/build.txt
artifacts:
  files:
    - asg2/dist/build.txt
